# Build scope: everything here lives under DOT_BUILD_ROOT (scratch-friendly).
config:
  install_tree:
    root: ${DOT_BUILD_ROOT}/opt
    # Pad the prefix so binaries can be relocated into any (shorter) runtime
    # path when installed from the buildcache.
    padded_length: 128
  build_stage:
  - ${DOT_BUILD_ROOT}/stage
  source_cache: ${DOT_BUILD_ROOT}/cache/source
  misc_cache: ${DOT_BUILD_ROOT}/cache/misc
