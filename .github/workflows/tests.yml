name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fast-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
    - uses: actions/checkout@v4
    - name: Tools Makefile test
      run: bash tools/test/test_make.sh
    - name: Hermetic shell test
      run: bash test/test_hermetic.sh

  full-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
    - uses: actions/checkout@v4
    - name: Full install (build in scratch, deploy from buildcache, link env.sh)
      env:
        DOT_BUILD_ROOT: ${{ runner.temp }}/dotbuild
        DOT_RUNTIME_ROOT: ${{ runner.temp }}/dotruntime
      run: ./install.sh
    - name: Runtime works without the build root
      env:
        DOT_RUNTIME_ROOT: ${{ runner.temp }}/dotruntime
      run: |
        rm -rf "${{ runner.temp }}/dotbuild"
        test -L env.sh
        bash -c 'source stow-point/.profile && nvim --version && tmux -V && rg --version && dot -V'
